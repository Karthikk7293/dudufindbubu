<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dudu finds Bubu — video capture</title>
<style>html,body,#world{margin:0;width:100%;height:100%;overflow:hidden;background:#edf0d9}canvas{display:block}</style></head>
<body><div id="world"></div><script type="module">
import { ForestWorld } from '/src/world.js';
import { freshState, GIFTS, BUBU, MOON_NEST, collectGift } from '/src/game-state.js';
import { turnBear } from '/src/bear-motion.js';

const state={...freshState(),departed:true,position:{x:-8,z:8}};
const world=new ForestWorld(document.querySelector('#world'),state);
await world.initialize(async(p,message)=>console.log(`${p}% ${message}`));
world.playing=true;
world.renderer.setPixelRatio(1);
console.log('Warming up the scene');
await world.warmUp(async()=>{});
console.log('Scene ready');
let shot='', time=0;
const originalCamera=world.setCamera.bind(world);
world.setCamera=()=>{
  if(shot==='moon'){originalCamera(true,1/30);return;}
  world.follow.distance=shot==='birthday'?6.4:7.2;
  world.follow.pitch=.27;world.follow.yaw=.18+time*.025;
  originalCamera(true,1/30);
};

function reset(next){
  shot=next;time=0;world.story='exploring';world.storyTime=0;world.moonJourney=null;world.companion=null;
  world.partyGifts?.removeFromParent();world.partyGifts=null;
  world.confetti.forEach(h=>{h.removeFromParent();h.material.dispose();});world.confetti=[];
  world.state.collected=[];world.state.completed=false;world.state.bubuArrived=false;
  world.state.position={x:-8,z:8};world.state.companionPosition=null;
  world.dudu.visible=true;world.bubu.visible=false;world.dudu.rotation.y=.2;world.bubu.rotation.y=.2;
  world.duduNest.door.rotation.y=0;world.bubuNest.door.rotation.y=0;
  world.picnicCake.visible=false;world.candleFlame.visible=false;
  world.setTimeOfDay('day',true);world.setWeather('clear',true);
  for(const b of [world.dudu,world.bubu]){
    b.userData.expression.reset();b.userData.lastPosition=null;b.userData.gait=b.userData.strideWeight=b.userData.runWeight=0;
    b.userData.body.position.set(0,0,0);b.userData.body.rotation.set(0,0,0);b.userData.head.rotation.set(0,0,0);
    b.userData.groundShadow.visible=true;
  }
  world.gifts.forEach(g=>{g.group.visible=g.ring.visible=g.sparkle.visible=true;});
  if(next==='gifts'){world.state.position={x:-5.8,z:8.4};world.dudu.rotation.y=-Math.PI/2;}
  if(['birthday','rain','moon'].includes(next)){
    world.state.collected=GIFTS.map(g=>g.id);world.state.bubuArrived=true;world.bubu.visible=true;
    world.gifts.forEach(g=>{g.group.visible=g.ring.visible=g.sparkle.visible=false;});
  }
  if(next==='birthday'){
    world.state.position={x:4.2,z:-26.5};world.bubu.position.set(BUBU.x,.25,BUBU.z);world.celebrate();
  }
  if(next==='rain'){
    world.state.completed=true;world.state.position={x:-9.2,z:8.5};
    world.state.companionPosition={x:-7.3,z:8.5};world.beginTogether();world.setWeather('rain',true);
    world.shareMoment();
  }
  if(next==='moon'){
    world.state.completed=true;world.state.position={...MOON_NEST.entry};
    world.state.companionPosition={x:-15,z:-22.6};world.beginTogether();
    if(!world.startMoonVisit())throw new Error('Moonwatch scene could not start');
    // Advance the real ladder sequence before recording the stargazing scene.
    for(let i=0;i<150;i++)world.updateMoonJourney(.1);
    world.setTimeOfDay('night',true);world.sky.nightTime=0;
  }
  world.addBackpackGifts();world.update(0);world.renderer.getContext().finish();
}

window.renderShot=(next,t,dt=1/30)=>{
  if(shot!==next)reset(next);
  time=t;
  let moving=false;
  if(next==='gifts'){
    const p=Math.min(1,t/1.85);world.state.position.x=-5.8-p*2.35;world.state.position.z=8.4-p*.4;
    moving=t<1.85;
    if(t>=1.95&&!world.state.collected.length){if(!collectGift(world.state,'flowers'))throw new Error('Gift collection failed');world.collect('flowers');}
    turnBear(world.dudu,t<1.95?-Math.PI/2:.15,dt);
  }
  if(next==='rain'){
    world.dudu.rotation.y=.25;world.bubu.rotation.y=-.15;
    if(t>2.2){world.state.position.z=8.5+(t-2.2)*.5;moving=true;}
  }
  world.update(dt,moving);world.renderer.getContext().finish();
  return world.renderer.domElement.toDataURL('image/jpeg',.96).split(',')[1];
};
window.captureInfo=()=>({story:world.story,gifts:state.collected.length,moon:world.moonJourney?.phase,width:innerWidth,height:innerHeight});
window.ready=true;
</script></body></html>
