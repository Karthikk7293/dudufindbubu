<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eee9df" />
  <title>Dudu · Character workshop</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/character-studio.css" />
</head>
<body>
  <main>
    <header><div><p class="eyebrow">A little more life</p><h1>Meet Dudu</h1><p>Blender character study · first edition</p></div><a class="forest-link" href="/?dudu=blender">Try in the forest <span aria-hidden="true">↗</span></a></header>
    <section id="stage" aria-label="Interactive 3D preview of Dudu">
      <div id="loading" role="status"><span class="spinner"></span><strong id="load-label">Getting Dudu ready…</strong><progress id="load-progress" aria-label="Model download"></progress><button id="retry" hidden>Try again</button></div>
      <p class="orbit-hint">Drag to turn · scroll or pinch to zoom</p>
      <button id="reset-camera" class="reset" aria-label="Reset camera" disabled>Reset view</button>
    </section>
    <footer>
      <fieldset disabled id="controls"><legend class="sr-only">Character controls</legend>
        <div class="control-group"><span id="movement-label">Movement</span><div class="pills" role="group" aria-labelledby="movement-label"><button data-clip="Idle" aria-pressed="true">Breathe</button><button data-clip="Walk" aria-pressed="false">Walk</button></div></div>
        <div class="control-group"><span id="expression-label">Expression</span><div class="pills" role="group" aria-labelledby="expression-label"><button data-mood="calm" aria-pressed="true">Calm</button><button data-mood="delighted" aria-pressed="false">Happy</button><button data-mood="shy" aria-pressed="false">Shy</button><button data-mood="surprised" aria-pressed="false">Surprised</button></div></div>
        <button id="pause" class="secondary" aria-pressed="false">Pause</button>
      </fieldset>
      <p class="note">Soft joints, expressive eyes, and a bag full of birthday wishes.</p>
    </footer>
  </main>
  <script type="module" src="/src/character-studio.js"></script>
</body>
</html>
